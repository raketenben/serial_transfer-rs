[package]
name = "serial_transfer"
version = "0.2.0"
edition = "2021"
resolver = "2"


[features]
std = ["serialport","embedded-io/std"]

[dependencies]
array-concat = "0.5.5"
embedded-io = { version = "0.6.1" }
serialport = { version = "4.7.0", optional = true }

[dev-dependencies]
serialport = { version = "4.7.0" }
rand = "0.9.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[lib]
doctest = false
